# FILE: src/vendor-api/schema.graphql
# PURPOSE: GraphQL schema for TunerSwap Vendor API
# STATUS: Production-ready
#
# This is the Vendor API - a separate API layer that enforces row-level security.
# All queries and mutations are scoped to the authenticated vendor's data.

# =============================================================================
# SCALARS
# =============================================================================

scalar DateTime
scalar JSON
scalar Decimal

# =============================================================================
# ENUMS
# =============================================================================

enum SellerStatus {
  PENDING
  APPROVED
  SUSPENDED
  REJECTED
}

enum ProductType {
  TUNE
  PART
  SERVICE
}

enum ProductStatus {
  DRAFT
  ACTIVE
  ARCHIVED
  DELETED
}

enum OrderStatus {
  PENDING
  CONFIRMED
  PROCESSING
  SHIPPED
  DELIVERED
  COMPLETED
  CANCELLED
  REFUNDED
}

enum PaymentStatus {
  PENDING
  AUTHORIZED
  CAPTURED
  PARTIALLY_REFUNDED
  REFUNDED
  FAILED
}

enum FulfillmentStatus {
  UNFULFILLED
  PARTIALLY_FULFILLED
  FULFILLED
  RETURNED
}

enum ReviewStatus {
  PENDING
  APPROVED
  REJECTED
  FLAGGED
}

enum MessageType {
  GENERAL
  ORDER_INQUIRY
  QUOTE_REQUEST
  SUPPORT
  SYSTEM
}

enum CalendarEventType {
  SERVICE_APPOINTMENT
  TUNE_SESSION
  CONSULTATION
  PICKUP
  DELIVERY
  REMINDER
  BLOCKED
}

enum CalendarEventStatus {
  PENDING
  CONFIRMED
  IN_PROGRESS
  COMPLETED
  CANCELLED
  NO_SHOW
}

enum SortOrder {
  ASC
  DESC
}

# =============================================================================
# INPUT TYPES
# =============================================================================

input RegisterSellerInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
  phone: String
  location: String
  businessName: String
  website: String
  bio: String
  """Desired URL slug for the seller profile (will be validated and normalized)"""
  desiredSlug: String
}

input UpdateSellerProfileInput {
  firstName: String
  lastName: String
  phone: String
  location: String
  address: String
  businessName: String
  website: String
  bio: String
  description: String
  socialLinks: JSON
  profileImageUrl: String
  bannerImageUrl: String
  experience: String
  software: [String!]
  vehiclePlatforms: [String!]
  tuneTypes: [String!]
  hasDyno: Boolean
  businessHours: JSON
}

input CreateProductInput {
  sku: String!
  name: String!
  description: String
  price: Decimal!
  compareAtPrice: Decimal
  productType: ProductType!
  isDigital: Boolean
  stockLevel: Int
  trackInventory: Boolean
  featuredImageUrl: String
  imageUrls: [String!]
  metaTitle: String
  metaDescription: String
  collectionIds: [Int!]
  facetValueIds: [Int!]
  compatibility: [ProductCompatibilityInput!]
}

input UpdateProductInput {
  sku: String
  name: String
  description: String
  price: Decimal
  compareAtPrice: Decimal
  stockLevel: Int
  trackInventory: Boolean
  status: ProductStatus
  featuredImageUrl: String
  imageUrls: [String!]
  metaTitle: String
  metaDescription: String
  collectionIds: [Int!]
  facetValueIds: [Int!]
  compatibility: [ProductCompatibilityInput!]
}

input ProductCompatibilityInput {
  make: String!
  model: String!
  yearStart: Int
  yearEnd: Int
  engine: String
  transmission: String
  notes: String
}

input UploadTuneFileInput {
  productId: Int!
  fileName: String!
  filePath: String!
  fileSize: Int!
  fileHash: String!
  mimeType: String!
  ecuType: String
  platform: String
  compatibility: JSON
}

input ProductFilterInput {
  search: String
  productType: ProductType
  status: ProductStatus
  collectionId: Int
  minPrice: Decimal
  maxPrice: Decimal
  compatibility: CompatibilityFilterInput
}

input CompatibilityFilterInput {
  make: String
  model: String
  year: Int
}

input ProductSortInput {
  field: ProductSortField!
  order: SortOrder!
}

enum ProductSortField {
  NAME
  PRICE
  CREATED_AT
  UPDATED_AT
  STOCK_LEVEL
}

input OrderFilterInput {
  status: OrderStatus
  paymentStatus: PaymentStatus
  fulfillmentStatus: FulfillmentStatus
  dateFrom: DateTime
  dateTo: DateTime
  search: String
}

input OrderSortInput {
  field: OrderSortField!
  order: SortOrder!
}

enum OrderSortField {
  PLACED_AT
  TOTAL
  STATUS
}

input UpdateOrderInput {
  status: OrderStatus
  fulfillmentStatus: FulfillmentStatus
  trackingNumber: String
  trackingUrl: String
  internalNotes: String
}

input SendMessageInput {
  receiverId: String!
  subject: String
  content: String!
  messageType: MessageType
  orderId: Int
  productId: Int
  parentMessageId: Int
}

input CreateCalendarEventInput {
  title: String!
  description: String
  eventType: CalendarEventType!
  startTime: DateTime!
  endTime: DateTime!
  allDay: Boolean
  timezone: String
  location: String
  isVirtual: Boolean
  meetingUrl: String
  customerId: String
  customerName: String
  customerEmail: String
  customerPhone: String
  orderId: Int
  vehicleInfo: JSON
  reminders: JSON
}

input UpdateCalendarEventInput {
  title: String
  description: String
  startTime: DateTime
  endTime: DateTime
  allDay: Boolean
  location: String
  isVirtual: Boolean
  meetingUrl: String
  status: CalendarEventStatus
  reminders: JSON
}

input ReviewResponseInput {
  reviewId: Int!
  response: String!
}

# =============================================================================
# TYPES
# =============================================================================

type Seller {
  id: Int!
  slug: String!
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  location: String
  address: String
  businessName: String
  website: String
  bio: String
  description: String
  socialLinks: JSON
  profileImageUrl: String
  bannerImageUrl: String
  experience: String
  software: [String!]!
  vehiclePlatforms: [String!]!
  tuneTypes: [String!]!
  hasDyno: Boolean!
  businessHours: JSON
  status: SellerStatus!
  verified: Boolean!
  verifiedAt: DateTime

  # Statistics
  rating: Float!
  reviewCount: Int!
  tunesSold: Int!
  partsSold: Int!
  servicesDone: Int!
  totalOrders: Int!
  totalRevenue: Decimal!

  # Payment
  stripeConnected: Boolean!
  paypalConnected: Boolean!

  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations (only for own profile)
  products(filter: ProductFilterInput, sort: ProductSortInput, skip: Int, take: Int): ProductList!
  orders(filter: OrderFilterInput, sort: OrderSortInput, skip: Int, take: Int): OrderList!
  reviews(skip: Int, take: Int): ReviewList!
}

# Public seller profile (limited fields)
type PublicSeller {
  id: Int!
  slug: String!
  firstName: String!
  lastName: String!
  location: String
  businessName: String
  website: String
  bio: String
  description: String
  socialLinks: JSON
  profileImageUrl: String
  bannerImageUrl: String
  experience: String
  software: [String!]!
  vehiclePlatforms: [String!]!
  tuneTypes: [String!]!
  hasDyno: Boolean!
  businessHours: JSON
  verified: Boolean!
  rating: Float!
  reviewCount: Int!
  tunesSold: Int!
  createdAt: DateTime!

  # Public products
  products(filter: ProductFilterInput, sort: ProductSortInput, skip: Int, take: Int): ProductList!
  reviews(skip: Int, take: Int): ReviewList!
}

type SellerList {
  items: [PublicSeller!]!
  totalItems: Int!
}

type Product {
  id: Int!
  sku: String!
  slug: String!
  name: String!
  description: String
  price: Decimal!
  compareAtPrice: Decimal
  vendorId: Int!
  vendor: PublicSeller!
  productType: ProductType!
  isDigital: Boolean!
  stockLevel: Int!
  trackInventory: Boolean!
  status: ProductStatus!
  publishedAt: DateTime
  featuredImageUrl: String
  imageUrls: [String!]!
  metaTitle: String
  metaDescription: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  tuneFiles: [TuneFile!]!
  collections: [Collection!]!
  facetValues: [FacetValue!]!
  compatibility: [ProductCompatibility!]!
  reviews(skip: Int, take: Int): ReviewList!
}

type ProductList {
  items: [Product!]!
  totalItems: Int!
}

type TuneFile {
  id: Int!
  productId: Int!
  fileName: String!
  filePath: String!
  fileSize: Int!
  fileHash: String!
  mimeType: String!
  ecuType: String
  platform: String
  compatibility: JSON
  downloadCount: Int!
  uploadedAt: DateTime!
}

type ProductCompatibility {
  id: Int!
  make: String!
  model: String!
  yearStart: Int
  yearEnd: Int
  engine: String
  transmission: String
  notes: String
}

type Collection {
  id: Int!
  name: String!
  slug: String!
  description: String
  parentId: Int
  position: Int!
  imageUrl: String
  products(filter: ProductFilterInput, skip: Int, take: Int): ProductList!
}

type CollectionList {
  items: [Collection!]!
  totalItems: Int!
}

type Facet {
  id: Int!
  name: String!
  code: String!
  values: [FacetValue!]!
}

type FacetValue {
  id: Int!
  facetId: Int!
  name: String!
  code: String!
  facet: Facet!
}

type FacetList {
  items: [Facet!]!
  totalItems: Int!
}

type Order {
  id: Int!
  orderNumber: String!
  vendorId: Int!
  buyerId: String!
  buyerEmail: String!
  buyerName: String!
  subtotal: Decimal!
  shippingTotal: Decimal!
  taxTotal: Decimal!
  discountTotal: Decimal!
  total: Decimal!
  platformFee: Decimal!
  vendorPayout: Decimal!
  status: OrderStatus!
  paymentStatus: PaymentStatus!
  fulfillmentStatus: FulfillmentStatus!
  shippingAddress: JSON
  shippingMethod: String
  trackingNumber: String
  trackingUrl: String
  customerNotes: String
  internalNotes: String
  placedAt: DateTime!
  paidAt: DateTime
  fulfilledAt: DateTime
  cancelledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!

  lines: [OrderLine!]!
}

type OrderLine {
  id: Int!
  orderId: Int!
  productId: Int
  product: Product
  productName: String!
  productSku: String!
  productType: ProductType!
  unitPrice: Decimal!
  quantity: Int!
  lineTotal: Decimal!
  downloadUrl: String
  downloadCount: Int!
  downloadExpiresAt: DateTime
}

type OrderList {
  items: [Order!]!
  totalItems: Int!
}

type Review {
  id: Int!
  productId: Int
  product: Product
  vendorId: Int!
  authorId: String!
  authorName: String!
  rating: Int!
  title: String
  body: String
  status: ReviewStatus!
  verifiedPurchase: Boolean!
  vendorResponse: String
  respondedAt: DateTime
  createdAt: DateTime!
}

type ReviewList {
  items: [Review!]!
  totalItems: Int!
}

type Message {
  id: Int!
  senderId: String!
  senderType: String!
  receiverId: String!
  receiverType: String!
  subject: String
  content: String!
  attachments: [String!]!
  orderId: Int
  productId: Int
  messageType: MessageType!
  read: Boolean!
  readAt: DateTime
  parentMessageId: Int
  replies: [Message!]!
  createdAt: DateTime!
}

type MessageList {
  items: [Message!]!
  totalItems: Int!
  unreadCount: Int!
}

type CalendarEvent {
  id: Int!
  vendorId: Int!
  customerId: String
  customerName: String
  customerEmail: String
  customerPhone: String
  title: String!
  description: String
  eventType: CalendarEventType!
  startTime: DateTime!
  endTime: DateTime!
  allDay: Boolean!
  timezone: String!
  location: String
  isVirtual: Boolean!
  meetingUrl: String
  status: CalendarEventStatus!
  orderId: Int
  vehicleInfo: JSON
  reminders: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CalendarEventList {
  items: [CalendarEvent!]!
  totalItems: Int!
}

type SellerStats {
  totalRevenue: Decimal!
  monthlyRevenue: Decimal!
  totalOrders: Int!
  pendingOrders: Int!
  totalProducts: Int!
  activeProducts: Int!
  tuneProducts: Int!
  partProducts: Int!
  serviceProducts: Int!
  averageRating: Float!
  totalReviews: Int!
  unreadMessages: Int!
  upcomingEvents: Int!
}

type AuthPayload {
  token: String!
  seller: Seller!
}

type SuccessResponse {
  success: Boolean!
  message: String
}

# =============================================================================
# QUERIES
# =============================================================================

type Query {
  # -------------------------
  # Authenticated Seller Queries
  # -------------------------

  """
  Get the current authenticated seller's profile
  Requires: Valid vendor JWT
  """
  me: Seller!

  """
  Get dashboard statistics for current seller
  Requires: Valid vendor JWT
  """
  myStats: SellerStats!

  """
  Get current seller's products with filtering and pagination
  Requires: Valid vendor JWT
  """
  myProducts(
    filter: ProductFilterInput
    sort: ProductSortInput
    skip: Int = 0
    take: Int = 20
  ): ProductList!

  """
  Get a specific product by ID (must belong to current seller)
  Requires: Valid vendor JWT
  """
  myProduct(id: Int!): Product

  """
  Get current seller's orders with filtering and pagination
  Requires: Valid vendor JWT
  """
  myOrders(
    filter: OrderFilterInput
    sort: OrderSortInput
    skip: Int = 0
    take: Int = 20
  ): OrderList!

  """
  Get a specific order by ID (must belong to current seller)
  Requires: Valid vendor JWT
  """
  myOrder(id: Int!): Order

  """
  Get current seller's reviews
  Requires: Valid vendor JWT
  """
  myReviews(skip: Int = 0, take: Int = 20): ReviewList!

  """
  Get current seller's messages
  Requires: Valid vendor JWT
  """
  myMessages(
    unreadOnly: Boolean = false
    skip: Int = 0
    take: Int = 20
  ): MessageList!

  """
  Get a specific message thread
  Requires: Valid vendor JWT
  """
  myMessageThread(messageId: Int!): [Message!]!

  """
  Get current seller's calendar events
  Requires: Valid vendor JWT
  """
  myCalendarEvents(
    startDate: DateTime
    endDate: DateTime
    status: CalendarEventStatus
    skip: Int = 0
    take: Int = 50
  ): CalendarEventList!

  # -------------------------
  # Public Queries (no auth required)
  # -------------------------

  """
  Get public seller profile by slug
  """
  seller(slug: String!): PublicSeller

  """
  List all approved sellers
  """
  sellers(
    search: String
    skip: Int = 0
    take: Int = 20
  ): SellerList!

  """
  Get public product by ID or slug
  """
  product(id: Int, slug: String): Product

  """
  Search/filter public products across all vendors
  """
  products(
    filter: ProductFilterInput
    sort: ProductSortInput
    skip: Int = 0
    take: Int = 20
  ): ProductList!

  """
  Get all collections
  """
  collections: CollectionList!

  """
  Get collection by slug with products
  """
  collection(slug: String!): Collection

  """
  Get all facets for filtering
  """
  facets: FacetList!
}

# =============================================================================
# MUTATIONS
# =============================================================================

type Mutation {
  # -------------------------
  # Authentication
  # -------------------------

  """
  Register a new seller account
  Returns JWT token on success
  """
  registerSeller(input: RegisterSellerInput!): AuthPayload!

  """
  Login as seller
  Returns JWT token on success
  """
  loginSeller(email: String!, password: String!): AuthPayload!

  """
  Refresh the current JWT token
  Requires: Valid vendor JWT
  """
  refreshToken: AuthPayload!

  # -------------------------
  # Profile Management
  # -------------------------

  """
  Update current seller's profile
  Requires: Valid vendor JWT
  """
  updateMyProfile(input: UpdateSellerProfileInput!): Seller!

  """
  Change password
  Requires: Valid vendor JWT
  """
  changePassword(currentPassword: String!, newPassword: String!): SuccessResponse!

  """
  Connect Stripe account
  Requires: Valid vendor JWT
  """
  connectStripe(authorizationCode: String!): Seller!

  """
  Connect PayPal account
  Requires: Valid vendor JWT
  """
  connectPaypal(paypalEmail: String!): Seller!

  # -------------------------
  # Product Management
  # -------------------------

  """
  Create a new product
  Requires: Valid vendor JWT
  """
  createProduct(input: CreateProductInput!): Product!

  """
  Update an existing product (must belong to current seller)
  Requires: Valid vendor JWT
  """
  updateProduct(id: Int!, input: UpdateProductInput!): Product!

  """
  Delete a product (must belong to current seller)
  Requires: Valid vendor JWT
  """
  deleteProduct(id: Int!): SuccessResponse!

  """
  Publish a draft product
  Requires: Valid vendor JWT
  """
  publishProduct(id: Int!): Product!

  """
  Archive a product
  Requires: Valid vendor JWT
  """
  archiveProduct(id: Int!): Product!

  """
  Upload a tune file to a product
  Requires: Valid vendor JWT
  """
  uploadTuneFile(input: UploadTuneFileInput!): TuneFile!

  """
  Delete a tune file
  Requires: Valid vendor JWT
  """
  deleteTuneFile(id: Int!): SuccessResponse!

  # -------------------------
  # Order Management
  # -------------------------

  """
  Update order status/tracking (must belong to current seller)
  Requires: Valid vendor JWT
  """
  updateOrder(id: Int!, input: UpdateOrderInput!): Order!

  """
  Mark order as shipped
  Requires: Valid vendor JWT
  """
  shipOrder(id: Int!, trackingNumber: String, trackingUrl: String): Order!

  """
  Mark order as fulfilled/completed
  Requires: Valid vendor JWT
  """
  fulfillOrder(id: Int!): Order!

  """
  Cancel an order (subject to business rules)
  Requires: Valid vendor JWT
  """
  cancelOrder(id: Int!, reason: String): Order!

  """
  Generate download link for digital product
  Requires: Valid vendor JWT
  """
  generateDownloadLink(orderLineId: Int!): String!

  # -------------------------
  # Messaging
  # -------------------------

  """
  Send a message to a buyer
  Requires: Valid vendor JWT
  """
  sendMessage(input: SendMessageInput!): Message!

  """
  Mark message(s) as read
  Requires: Valid vendor JWT
  """
  markMessagesRead(messageIds: [Int!]!): SuccessResponse!

  # -------------------------
  # Calendar
  # -------------------------

  """
  Create a calendar event
  Requires: Valid vendor JWT
  """
  createCalendarEvent(input: CreateCalendarEventInput!): CalendarEvent!

  """
  Update a calendar event (must belong to current seller)
  Requires: Valid vendor JWT
  """
  updateCalendarEvent(id: Int!, input: UpdateCalendarEventInput!): CalendarEvent!

  """
  Delete a calendar event
  Requires: Valid vendor JWT
  """
  deleteCalendarEvent(id: Int!): SuccessResponse!

  """
  Confirm a pending appointment
  Requires: Valid vendor JWT
  """
  confirmCalendarEvent(id: Int!): CalendarEvent!

  """
  Cancel a calendar event
  Requires: Valid vendor JWT
  """
  cancelCalendarEvent(id: Int!, reason: String): CalendarEvent!

  # -------------------------
  # Reviews
  # -------------------------

  """
  Respond to a review
  Requires: Valid vendor JWT
  """
  respondToReview(input: ReviewResponseInput!): Review!
}

# =============================================================================
# SUBSCRIPTIONS (for real-time updates)
# =============================================================================

type Subscription {
  """
  New order notification
  """
  orderReceived(vendorId: Int!): Order!

  """
  New message notification
  """
  messageReceived(vendorId: Int!): Message!

  """
  Order status updated
  """
  orderUpdated(vendorId: Int!): Order!
}
